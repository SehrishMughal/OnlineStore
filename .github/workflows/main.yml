name: Markaz Daily Catalog Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every night at midnight UTC
  workflow_dispatch:      # Allows you to run it manually for testing

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run:  pip install -r requirements.txt

      - name: Run Markaz Scraper
        run: python product_catcher.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "zone-actions[bot]"
          git config --global user.email "zone@users.noreply.github.com"
          git add markaz_catalog.csv
          git commit -m "Update Markaz Catalog: $(date)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
